[project]
name = "xlsx-tools"
version = "0.1.0"
description = "Read-only XLSX extraction into pydantic records, with a full-fidelity cell model as escape hatch."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1",
    "pydantic>=2.7",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/xlsx_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
